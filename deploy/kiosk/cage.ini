# Cage Wayland compositor — kiosk config for POS terminal.
# Starts moyun-pos fullscreen, no window decorations, no shell escape.
#
# Place this at /etc/cage/config or pass via:
#   cage -c /opt/moyun-pos/deploy/kiosk/cage.ini -- /opt/moyun-pos/moyun-pos
#
# Reference: https://github.com/cage-kiosk/cage

# Disable all keybindings that could escape the kiosk:
# - No Ctrl+Alt+Backspace (kill compositor)
# - No Alt+Tab (switch windows — there's only one)
# - No Super key (no shell launcher)
[keyboard]
disable_keybindings = true

# Single output, no rotation, native resolution.
# The Penetek A3216 M82 has a 15.6" 1920x1080 touch panel.
[output]
mode = 1920x1080
