# ESP - systemd-boot + one UKI per installed kernel (EFI/Linux/*.efi).
# mkosi installs them into /boot and /efi of the image tree (Bootloader=
# systemd-boot in mkosi.conf); with our own mkosi.repart/ it is this
# definition that copies them into the partition, as mkosi's default
# ESP definition does. Without these two lines the ESP stays empty and
# the image does not boot. deploy/image/build.sh adds two more UKIs
# here after `mkosi build` finishes (Install/Update USB boot entries) -
# see the comment at the top of that script for why that happens as a
# separate, later step instead of an mkosi postoutput script.
[Partition]
Type=esp
Format=vfat
CopyFiles=/boot:/
CopyFiles=/efi:/
SizeMinBytes=512M
SizeMaxBytes=512M
