# ESP — systemd-boot + one UKI per installed kernel (EFI/Linux/*.efi),
# populated by mkosi itself after this partition is created (Bootloader=
# systemd-boot in mkosi.conf). deploy/image/build.sh adds two more UKIs
# here after `mkosi build` finishes (Install/Update USB boot entries) —
# see the comment at the top of that script for why that happens as a
# separate, later step instead of an mkosi postoutput script.
[Partition]
Type=esp
Format=vfat
SizeMinBytes=512M
SizeMaxBytes=512M
