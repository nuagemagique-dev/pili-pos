# root - ext4, populated with the OS tree mkosi built (CopyFiles=/),
# and the GPT "read-only" attribute set (ReadOnly=yes) so systemd mounts
# it ro automatically. dm-verity is deliberately NOT used here (Phase 4
# plan: "dm-verity deferred to A/B updates") - integrity of what ships
# on / is covered instead by the SHA-1 of /opt/pili-pos/pili-pos
# checked in .github/workflows/image.yml and on-site with `sha1sum`
# (MANUEL_INSTALLATION_FR.md §5).
#
# Type=root resolves to the architecture's Discoverable Partitions Spec
# root GUID, which is why no `root=` kernel argument is needed.
[Partition]
Type=root
Format=ext4
CopyFiles=/
SizeMinBytes=4G
SizeMaxBytes=4G
ReadOnly=yes
