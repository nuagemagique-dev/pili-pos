# Admission image only: copy the journal to the first serial port, so
# the CI boot test (scripts/qemu/boot-check.sh) and a technician with a
# serial cable can read the whole boot. Secrets are never logged (see
# usr/local/lib/pili-pos/pili-provision).
[Journal]
ForwardToConsole=yes
TTYPath=/dev/ttyS0
MaxLevelConsole=info
