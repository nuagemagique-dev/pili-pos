# Runtime (boot-time) partition definition, read by systemd-repart.service
# on every boot — distinct from deploy/image/mkosi.repart/, which only
# runs at image-build time. Idempotent by design: once the "moyun-data"
# partition exists, systemd-repart leaves it alone (beyond growing it if
# the underlying disk has more free space than last boot, since
# SizeMaxBytes is left unbounded on purpose — the terminal's whole
# 128GB SSD belongs to this partition once ESP+root are carved out).
#
# Deliberately NOT `Type=var` (the Discoverable Partitions Spec "Var
# Partition" GUID): that type asks systemd-gpt-auto-generator to also
# try to discover and mount it on its own, which would race with the
# explicit crypttab/fstab entries this image ships and with
# moyun-provision.service's first-boot LUKS setup. `linux-generic` keeps
# exactly one thing in charge of /var: those two files.
#
# No Format= and no Encrypt=: the partition is created empty.
# moyun-provision.service (usr/lib/systemd/system/) does the LUKS2
# setup, TPM2 enrollment and mkfs.ext4 itself — see that unit and
# usr/local/lib/moyun-pos/moyun-provision for why (recovery key
# enrollment, factory content copy, password display) versus
# systemd-repart's own built-in `Encrypt=tpm2`.
[Partition]
Type=linux-generic
Label=moyun-data
SizeMinBytes=1G
