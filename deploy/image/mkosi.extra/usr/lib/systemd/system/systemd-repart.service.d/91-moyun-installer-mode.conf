## Never run systemd-repart against the USB stick itself when booted in
## installer/updater mode (moyun.installer=install|update, see
## moyun-installer.service) — repart.d/90-moyun-data.conf would
## otherwise try to grow a "moyun-data" partition into the USB stick's
## own free space, which makes no sense on install media.
[Unit]
ConditionKernelCommandLine=!moyun.installer
