## Never run systemd-repart against the USB stick itself when booted in
## installer/updater mode (pili.installer=install|update, see
## pili-installer.service) - repart.d/90-pili-data.conf would
## otherwise try to grow a "pili-data" partition into the USB stick's
## own free space, which makes no sense on install media.
[Unit]
ConditionKernelCommandLine=!pili.installer
