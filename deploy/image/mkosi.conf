# deploy/image/mkosi.conf - moyun-pos kiosk image (Debian 12 "bookworm")
#
# Built with a pinned mkosi release (deploy/image/.mkosi-pin, read by
# deploy/image/build.sh and .github/workflows/image.yml) and
# `ToolsTree=default` below, so the build/boot tools (systemd-repart,
# ukify, mtools, dosfstools, ...) come from mkosi's own reproducible
# tools tree instead of whatever happens to be on the build host.
#
# Two profiles select what goes on top of this shared base -
# mkosi.profiles/admission/ (SPF certification test machine) and
# mkosi.profiles/production/ (restaurant deployment). Neither is a
# default: deploy/image/build.sh always passes --profile= explicitly.
#
# Partition layout (mkosi.repart/, built at image time):
#   1: ESP, 512M, vfat, systemd-boot + a UKI per installed kernel
#   2: root, 4G, ext4, GPT read-only flag set (root 5 "ro" cmdline
#      below is a belt-and-braces duplicate of that flag)
# A third partition ("moyun-data", LUKS2 -> ext4, mounted on /var) is
# created at FIRST BOOT, not at image build time - see
# mkosi.extra/usr/lib/repart.d/90-moyun-data.conf and
# mkosi.extra/usr/lib/systemd/system/moyun-provision.service.

[Distribution]
Distribution=debian
Release=bookworm
Architecture=x86-64
Repositories=contrib,non-free,non-free-firmware

[Output]
Format=disk
OutputDirectory=mkosi.output
ImageId=moyun-pos-kiosk
CompressOutput=no
SplitArtifacts=no

[Content]
Bootable=yes
Bootloader=systemd-boot
# No `root=`: the root partition carries the Discoverable Partitions
# Spec GUID (Type=root in mkosi.repart/20-root.conf) so systemd finds
# and mounts it automatically; its GPT "read-only" attribute (set by
# ReadOnly=yes on that same partition) is what actually makes / ro.
# `ro` here is a second, explicit safety net; `moyun.installer=` is
# appended only on the two extra USB boot entries built by
# deploy/image/build.sh (see that script - not part of the base image).
KernelCommandLine=ro quiet
Ssh=never
Autologin=no
Locale=fr_FR.UTF-8
Keymap=be-latin1
Timezone=Europe/Brussels
Hostname=moyun-pos
# Locked (no valid hash) at build time. moyun-provision.service
# generates a real random password on first boot, remounting / rw for
# the duration of the `chpasswd` call, and displays it once - see
# docs/SUBMISSION_ARTIFACTS/SECURITE_BD_FR.md §3 and
# MANUEL_INSTALLATION_FR.md §3.
RootPassword=hashed:!
RemoveFiles=/var/cache/apt/archives/*.deb
# Same shared list deploy/provision/provision.sh installs on a plain
# Debian 12 box (deploy/provision/packages.txt), plus the image-only
# packages needed for booting, LUKS/TPM2 and the pos-db-ro wrapper.
# mkosi has no "read Packages= from an external file" directive, so
# these are kept in sync with packages.txt by hand - see the comment
# at the top of that file.
Packages=
        cage
        libwebkit2gtk-4.1-0
        libgtk-3-0
        libayatana-appindicator3-1
        librsvg2-common
        gstreamer1.0-plugins-base
        gstreamer1.0-plugins-good
        sqlite3
        fonts-noto-cjk
        fonts-noto-color-emoji
        vim-tiny
        network-manager
        chrony
        dbus-user-session
        xdg-desktop-portal-wlr
        pipewire
        wireplumber
        curl
        ca-certificates
        linux-image-amd64
        systemd-boot-efi
        cryptsetup
        cryptsetup-bin
        tpm2-tools
        e2fsprogs
        gdisk
        parted

[Build]
# Programs mkosi runs to build and boot the image (systemd-repart,
# ukify, mtools, mformat, ...) come from mkosi's own tools tree instead
# of the host, for reproducibility across the developer Mac (in an
# amd64 container) and the ubuntu-26.04 CI runner.
ToolsTree=default
# apt-get needs network to fetch packages; the *built image* is still
# fully offline (no package manager left in it, no network calls at
# runtime except FDM/printer LAN + the optional digital-ticket API).
WithNetwork=yes
