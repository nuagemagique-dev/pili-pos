[package]
name = "pos-export-mock"
version.workspace = true
edition.workspace = true
publish = false

# Test receiver of the nightly export. Never a normal dependency of a
# shipped crate: only dev-dependencies and the binary of its own.
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
sha2 = "0.10"
hex = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"

[lints]
workspace = true
