reason = "Sur Linux ce code n'est prouvé que par un test d'interface (bandeau sous l'en-tête) ; sur Android ce comportement est prouvé par les tests Robolectric FdmBannerTest (bandeau) et FdmTextsTest (texte français du code) et par le test Roborazzi FdmScreenshotTest (rendu), et la classification du code par le moteur est couverte par ses tests."
