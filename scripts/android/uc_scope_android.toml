# uc_scope_android.toml - declared exclusions of scripts/android/uc_matrix_android.py
#
# One table per official test identifier that the Linux matrix covers only with a Playwright or
# real-binary UI test (no Rust test) and that has no Android scenario. Fields:
#   reason = French, one sentence, why the Android matrix needs no scenario for this id.
#   kind   = "exclu_android" (optional, the only value).
#
# An id of the 47 required ids of P7D9 can never be listed here (it needs a scenario), and an
# entry for an id that gets a scenario, that the device run covers with Rust tests, or that Linux
# already excludes is reported as stale by --check.

# ---------------------------------------------------------------------------
# Certification manual, section V: messages of the FDM (banner under the header)
# ---------------------------------------------------------------------------

[V_CLIENT_CERT_EXPIRED]
reason = "Sur Linux ce code n'est prouvé que par un test d'interface (bandeau sous l'en-tête) ; sur Android le bandeau est indépendant du code et prouvé par les tests Robolectric FdmBannerTest, avec le rendu vérifié par le test Roborazzi FdmScreenshotTest ; le texte français du code est généré depuis la table de l'interface Linux (ui/src/utils/fdmMessages.ts) et sa synchronisation est contrôlée par `node scripts/android/vue_to_android.mjs --check` ; la classification du code est prouvée par les tests du moteur (fdm_monitor.rs) exécutés sur l'appareil."
kind = "exclu_android"

