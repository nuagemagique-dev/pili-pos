# uc_scope.toml - declared exclusions for scripts/uc_matrix.py
#
# One table per excluded official test identifier. Fields:
#   reason = French, one sentence, why this id has no test.
#   kind   = "hors_perimetre"  (feature absent from pili-pos v1.0.0)
#          | "non_applicable"  (this exact case cannot occur given our design)
#          | "couvert_par"     (another id's tests already exercise this case)
#   by     = required when kind = "couvert_par": the id that covers this one.
#
# Any id NOT listed here must have a matching test, or scripts/uc_matrix.py
# reports it as MANQUANT and exits 1.

# ---------------------------------------------------------------------------
# Basic Set / Reports
# ---------------------------------------------------------------------------

