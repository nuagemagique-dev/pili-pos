naming:
  FunctionNaming:
    # Composable functions are PascalCase by Compose convention.
    ignoreAnnotated:
      - 'Composable'

complexity:
  LongParameterList:
    ignoreAnnotated:
      - 'Composable'

style:
  # Match ktlint max_line_length in .editorconfig
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    ignoreAnnotated:
      - 'Preview'
      - 'Composable'
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '4'
      - '8'
      - '16'
      - '24'
      - '32'
      - '48'
      - '64'
    excludes:
      # detekt's default, lost by overriding the list: tests assert on literals
      - '**/test/**'
      - '**/androidTest/**'

build:
  # The UniFFI bindings are generated into build/ and are never scanned.
  excludes:
    - '**/build/**'
