# BeautifulRust clippy configuration (https://github.com/morganlinton/BeautifulRust).
# Flag any function with a bool parameter: a bool argument is unreadable at the
# call site and can't grow a third mode; use a two-variant enum or two methods.
max-fn-params-bools = 0
# Allow unwrap, expect and printing in tests, where a panic is the assertion.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
