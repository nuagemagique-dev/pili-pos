[versions]
# Pins equal to docs/android/DECISIONS.md section 5 (copied from moyun-handheld).
# r8 is forced through the root buildscript classpath (AGP 8.9.1 bundles an older one).
agp = "8.9.1"
kotlin = "2.2.20"
kotlinxCoroutines = "1.9.0"
# R8 bundled with AGP 8.9 predates Kotlin 2.2 metadata; Kotlin 2.2 needs R8 8.11+.
r8 = "8.13.25"
# JNA: plain jar for the JVM host tests (carries libjnidispatch for macOS and Linux).
jna = "5.19.1"
junit = "4.13.2"
# API snapshot of :pos-core (apiDump / apiCheck, PD60).
binaryCompatibilityValidator = "0.18.2"
# Lint gates, same versions as moyun-handheld.
ktlint = "12.2.0"
detekt = "1.23.7"
# Required by the android-flavour UniFFI bindings (@RequiresApi, android_cleaner).
androidxAnnotation = "1.9.1"
# Declared now for the later cards (instrumented tests); not used by :pos-core itself.
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestCore = "1.7.0"
androidxTestJunit = "1.3.0"

[libraries]
r8 = { module = "com.android.tools:r8", version.ref = "r8" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit-ktx", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
