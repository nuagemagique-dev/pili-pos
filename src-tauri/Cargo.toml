[package]
name = "moyun-pos"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
pos-core = { path = "../crates/pos-core" }
pos-fiscal = { path = "../crates/pos-fiscal" }
pos-print = { path = "../crates/pos-print" }
pos-db = { path = "../crates/pos-db" }
pos-hubrise = { path = "../crates/pos-hubrise", optional = true }
pos-hubrise-types = { path = "../crates/pos-hubrise-types", optional = true }
pos-peppol = { path = "../crates/pos-peppol", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
bcrypt = "0.17"
dirs = "6"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[features]
# Default dev build: includes the HubRise webshop integration so we can
# keep iterating on it. The certification build excludes hubrise entirely
# (`cargo build --release --no-default-features --features cert`).
default = ["hubrise", "peppol"]
# Enables the optional HubRise (webshop) integration: poller, outbox,
# /health endpoint that reports outbox depth, and the IPC commands.
hubrise = ["dep:pos-hubrise", "dep:pos-hubrise-types"]
# Enables Peppol BIS Billing 3.0 B2B e-invoicing: the UBL serializer,
# the AccessPoint trait, and the invoice (I event) commands. Not part of
# moyun-pos v1.0.0: the invoice event is optional in SCE 2.0 and ships in
# a later certified update, so the cert build leaves it out.
peppol = ["dep:pos-peppol"]
# Marker feature for the certification build: no third-party
# integrations (hubrise), no invoicing (peppol), UI bundle embedded.
# Build command: `cargo build --release --no-default-features --features cert`.
cert = ["custom-protocol"]
# Serve the embedded `ui/dist` bundle instead of the Vite dev server
# (`devUrl`). `cargo tauri build` turns it on by itself; a plain
# `cargo build` — the certification build above — must enable it, or
# the kiosk would try to load http://localhost:1420 and stay blank.
custom-protocol = ["tauri/custom-protocol"]
# Dev-only escape hatch: lets checkout succeed when the FDM is offline.
# NEVER ship this in a production build — SCE 2.0 mandates that the POS
# must block transactions when the FDM is unreachable.
allow-offline = []
