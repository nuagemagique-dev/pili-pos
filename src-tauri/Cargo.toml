[package]
name = "pili-pos"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
pos-core = { path = "../crates/pos-core" }
pos-fiscal = { path = "../crates/pos-fiscal" }
pos-db = { path = "../crates/pos-db" }
pos-engine = { path = "../crates/pos-engine", default-features = false }
pos-hubrise = { path = "../crates/pos-hubrise", optional = true }
pos-catalog = { path = "../crates/pos-catalog", optional = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
bcrypt = "0.19"
dirs = "7"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

[features]
# Default dev build.
default = ["hubrise"]
# The HubRise integration (online orders signed by the FDM, the menu
# mirrored from the catalog): poller, outbox, the IPC commands. Part of
# the certified binary; whether it runs is the installation's switch
# (`hubrise_enabled` in pos.json, then Settings, every change logged),
# not a build choice. Every shipped build has it.
hubrise = [
    "dep:pos-hubrise",
    "dep:pos-catalog",
    "pos-db/hubrise",
    "pos-engine/hubrise",
]
# The certification build: HubRise in, UI bundle embedded. Invoicing
# (event I, Peppol queue) is compiled in every build.
# Build command: `cargo build --release --no-default-features --features cert`.
cert = ["custom-protocol", "hubrise", "pos-engine/cert"]
# Serve the embedded `ui/dist` bundle instead of the Vite dev server
# (`devUrl`). `cargo tauri build` turns it on by itself; a plain
# `cargo build` - the certification build above - must enable it, or
# the kiosk would try to load http://localhost:1420 and stay blank.
custom-protocol = ["tauri/custom-protocol"]
