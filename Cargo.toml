[workspace]
resolver = "3"
members = [
    "src-tauri",
    "crates/pos-core",
    "crates/pos-fiscal",
    "crates/pos-print",
    "crates/pos-db",
    "crates/pos-fdm-mock",
    "crates/pos-hubrise-types",
    "crates/pos-hubrise-mock",
    "crates/pos-hubrise",
    "crates/pos-peppol",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Proprietary"
authors = ["Bruno <bruno@nuagemagique.dev>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.35", features = ["bundled", "backup"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-util = "0.7"
url = "2"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
