[workspace]
resolver = "3"
members = [
    "src-tauri",
    "crates/pos-core",
    "crates/pos-fiscal",
    "crates/pos-print",
    "crates/pos-db",
    "crates/pos-fdm-mock",
    "crates/pos-printer-mock",
    "crates/pos-scale",
    "crates/pos-scale-mock",
    "crates/pos-hubrise-types",
    "crates/pos-hubrise-mock",
    "crates/pos-catalog",
    "crates/pos-hubrise",
    "crates/pos-peppol",
    "crates/pos-mail",
    "crates/pos-engine",
    "crates/pos-engine-testkit",
    "crates/pos-export",
    "crates/pos-export-mock",
    "crates/pos-eft",
    "crates/pos-eft-mock",
    "crates/pos-eft-probe",
    "crates/pos-accounting",
]
# The Android Rust workspace lives in android/rust (from phase P2): its own
# workspace, never a member of this one.
exclude = ["android"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Proprietary"
authors = ["Bruno <bruno@nuagemagique.dev>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-util = "0.7"
url = "2"
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Lints (BeautifulRust, https://github.com/morganlinton/BeautifulRust, adapted to
# application crates: the library-only lints missing_docs, missing_errors_doc and
# missing_panics_doc are left out). CI runs clippy with -D warnings, so every
# warning here fails the build. Silence one locally with a reason:
#     #[expect(clippy::cast_possible_truncation, reason = "...")]
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Panics: return errors, and give every intentional panic a reason.
unwrap_used = "warn"
panic_in_result_fn = "warn"
# Suppressions explain themselves and expire when no longer needed.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Unsafe must be justified.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
# API shape.
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
# Idioms.
string_add = "warn"
wildcard_imports = "warn"
# Leftovers and output.
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Casts that silently lose information.
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
# Library-only rules (no crate here is published): errors and panics are
# documented where they matter, not on every function.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Pedantic lints that are noise here.
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
