name: Kiosk image

# Builds the SPF-certification kiosk image (deploy/image/, mkosi) and
# smoke-boots it under QEMU+KVM.
#
# Three jobs, chained:
#   repro       - builds deploy/build-release.sh --docker TWICE
#                 (scripts/check_repro.sh) and checks the pili-pos
#                 binary is byte-for-byte the same both times (the SHA-1 declared to SPF
#                 Finances must not depend on incidental build-host
#                 state).
#   image       - needs: repro. Installs the pinned mkosi
#                 (deploy/image/.mkosi-pin) and builds both profiles
#                 (production, admission); verifies, by mounting the
#                 root partition read-only, that /opt/pili-pos/
#                 pili-pos INSIDE each finished image is the exact
#                 binary repro just certified; uploads the .img.xz.
#   boot-smoke  - needs: image. Boots the admission image headless
#                 under QEMU (KVM + swtpm/TPM2) through its whole first
#                 boot (LUKS2 + TPM2 provisioning, banner, kiosk) and
#                 fails on any failed unit or broken ordering cycle in
#                 the guest journal, or if pili-pos.service does not
#                 stay up (scripts/qemu/boot-check.sh).
#
# runs-on: ubuntu-26.04 everywhere (needs KVM, and matches the
# platform deploy/image/build.sh and the manual assume).
# By hand or on a Linux release tag only (GitHub-hosted x86_64 with KVM; the
# homelab runner is ARM64). The Linux product is not part of the v1 filing.
on:
  push:
    tags: ['linux-v*']
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Reproducible build: same inputs, same binary, twice ──────────
  repro:
    name: Reproducible build (SHA-1 match)
    runs-on: ubuntu-26.04
    outputs:
      sha1: ${{ steps.compare.outputs.sha1 }}
    steps:
      - uses: actions/checkout@v7

      - name: Build twice from a clean tree and compare
        id: compare
        run: |
          set -euo pipefail
          scripts/check_repro.sh /tmp/repro
          echo "sha1=$(cat /tmp/repro/sha1)" >> "$GITHUB_OUTPUT"

      - name: Upload deploy/dist (build #2 - feeds the `image` job)
        uses: actions/upload-artifact@v7
        with:
          name: deploy-dist
          path: deploy/dist/
          # Only passes the build to the next job; the account artifact quota is shared.
          retention-days: 1

      - name: Upload both build_info reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repro-build-info
          path: |
            /tmp/repro/**/build_info_*.txt
            /tmp/repro/sha1
          retention-days: 14
          if-no-files-found: ignore

  # ── mkosi image build, both profiles ──────────────────────────────
  image:
    name: Kiosk image (mkosi)
    needs: repro
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        profile: [production, admission]
    steps:
      - uses: actions/checkout@v7

      - name: Download deploy/dist from the repro job
        uses: actions/download-artifact@v8
        with:
          name: deploy-dist
          path: deploy/dist

      - name: Restore executable bits
        # actions/upload-artifact does not preserve the executable
        # bit; deploy/build-release.sh's own chmod is lost across the
        # artifact round-trip.
        run: chmod +x deploy/dist/pili-pos deploy/dist/install.sh deploy/dist/update.sh deploy/dist/pos-fdm-mock

      - name: Host packages (mkosi's own prerequisites)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3 python3-venv python3-pip \
            binutils xz-utils gdisk parted util-linux e2fsprogs \
            systemd-container debian-archive-keyring python3-pefile

      # deploy/image/build.sh installs mkosi itself (pinned to
      # deploy/image/.mkosi-pin) into its own venv on first use - see
      # deploy/image/build.sh's own comments for why this is not
      # duplicated here as a separate "install mkosi" step.
      - name: Build the ${{ matrix.profile }} image
        run: sudo deploy/image/build.sh ${{ matrix.profile }}

      - name: Verify the embedded binary's SHA-1 (read-only mount of the root partition)
        run: |
          set -euo pipefail
          OUT_DIR="deploy/image/mkosi.output/${{ matrix.profile }}"
          RAW="$(find "$OUT_DIR" -maxdepth 1 -name '*.raw' | head -n1)"
          if [[ -z "$RAW" ]]; then
            echo "::error::no .raw image found in $OUT_DIR"
            exit 1
          fi
          EXPECTED_SHA1="$(cat "$OUT_DIR/pili-pos-embedded-binary.sha1")"
          # Plain losetup + read-only mount, as deploy/image/build.sh does:
          # the runner's systemd-dissect refuses the image ("File system
          # is too uncommon"). Partition 2 is the root (mkosi.repart/20-root.conf).
          MNT="$(mktemp -d)"
          LOOP="$(sudo losetup --show -f -P -r "$RAW")"
          trap 'sudo umount "$MNT" 2>/dev/null || true; sudo losetup -d "$LOOP" 2>/dev/null || true' EXIT
          sudo blkid "${LOOP}"p* || true
          sudo mount -o ro,noload "${LOOP}p2" "$MNT"
          ACTUAL_SHA1="$(sudo sha1sum "$MNT/opt/pili-pos/pili-pos" | awk '{print $1}')"
          echo "Expected (build_info / repro job): $EXPECTED_SHA1"
          echo "Actual   (inside the ${{ matrix.profile }} image): $ACTUAL_SHA1"
          if [[ "$EXPECTED_SHA1" != "$ACTUAL_SHA1" ]]; then
            echo "::error::/opt/pili-pos/pili-pos inside the ${{ matrix.profile }} image does not match the certified binary"
            exit 1
          fi
          echo "✓ Embedded binary matches the certified SHA-1"

      - name: Upload .img.xz
        uses: actions/upload-artifact@v7
        with:
          name: kiosk-image-${{ matrix.profile }}
          path: |
            deploy/image/mkosi.output/${{ matrix.profile }}/*.img.xz
            deploy/image/mkosi.output/${{ matrix.profile }}/pili-pos-embedded-binary.sha1
          # Large images: kept one day (the account artifact quota is shared).
          retention-days: 1

  # ── Boot smoke test: does the admission image actually come up? ──
  boot-smoke:
    name: Boot smoke test (admission image)
    needs: image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Enable /dev/kvm for this runner
        # GitHub-hosted Linux runners expose /dev/kvm but not
        # necessarily group-writable by the job user; this is the
        # standard workaround (see actions/runner-images issues on
        # KVM access).
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU, swtpm, OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 qemu-utils ovmf-generic swtpm \
            netcat-openbsd python3 python3-pil

      - name: Download the admission image
        uses: actions/download-artifact@v8
        with:
          name: kiosk-image-admission
          path: deploy/image/mkosi.output/admission

      - name: Boot headless, with a 15-minute ceiling
        id: boot
        run: |
          set -euo pipefail
          IMG="$(find deploy/image/mkosi.output/admission -maxdepth 1 -name '*.img.xz' | head -n1)"
          if [[ -z "$IMG" ]]; then
            echo "::error::no .img.xz artifact found for the admission profile"
            exit 1
          fi
          timeout 900 scripts/qemu/run-kiosk.sh "$IMG" --name boot-smoke --clean &
          echo "qemu_pid=$!" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 24); do
            [[ -S "scripts/qemu/.run/boot-smoke/qmp.sock" ]] && break
            sleep 5
          done
          if [[ ! -S "scripts/qemu/.run/boot-smoke/qmp.sock" ]]; then
            echo "::error::QMP socket never appeared - QEMU failed to start"
            exit 1
          fi

      # OVMF -> systemd-boot -> UKI -> systemd-repart (pili-data) ->
      # pili-provision (LUKS2 + TPM2, banner, Enter) -> Cage -> pili-pos,
      # judged from the guest journal on its serial port, not from the
      # frame alone: fails on any failed unit or broken ordering cycle.
      - name: First-boot check (provisioning, kiosk up, no failed unit)
        run: scripts/qemu/boot-check.sh boot-smoke 00_boot_admission

      - name: Stop QEMU
        if: always()
        run: |
          kill "${{ steps.boot.outputs.qemu_pid }}" 2>/dev/null || true
          sleep 2
          pkill -f 'qemu-system-x86_64.*boot-smoke' 2>/dev/null || true

      - name: Upload the screenshot and guest journal (always, including on failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-smoke-screenshot
          path: |
            docs/SUBMISSION_ARTIFACTS/screenshots/00_boot_admission.png
            scripts/qemu/.run/boot-smoke/serial.log
          retention-days: 30
          if-no-files-found: ignore
