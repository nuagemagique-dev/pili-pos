name: Dependabot Vite+ pin

# Completes Dependabot's `vite-plus` group PR: Dependabot bumps vite-plus and
# @voidzero-dev/* but cannot move the `overrides.vite` alias
# (npm:@voidzero-dev/vite-plus-core@<version>), so `npm run check` fails until
# the alias follows. This job moves it, refreshes the lockfile, pushes the
# commit on the PR branch and starts Tests again (a GITHUB_TOKEN push starts
# no workflow). CI watch then merges the PR as any green Dependabot PR.

on:
  pull_request:
    branches: [main]
    paths: ['ui/package.json']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.21.0"  # same as test.yml

jobs:
  sync:
    name: Move the vite-plus-core override
    # Dependabot's own ui/ branches only, never a fork.
    if: >-
      github.actor == 'dependabot[bot]'
      && startsWith(github.head_ref, 'dependabot/npm_and_yarn/ui/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Move the override, refresh the lockfile
        id: sync
        working-directory: ui
        run: |
          set -euo pipefail
          result=$(node scripts/sync-vite-plus-pin.mjs)
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = changed ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git diff --stat
          fi

      - name: Push and start Tests
        if: steps.sync.outputs.result == 'changed'
        run: |
          set -euo pipefail
          version=$(jq -r '.devDependencies["vite-plus"]' ui/package.json)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/package.json ui/package-lock.json
          git commit -m "build(deps): move the vite-plus-core override to $version"
          git push origin "HEAD:$BRANCH"
          gh workflow run test.yml --ref "$BRANCH"
