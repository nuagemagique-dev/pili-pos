name: Release

# Linux product only (the Tauri kiosk, src-tauri/LINUX_RELEASE_GAP.md). On a
# final linux-vX.Y.Z tag: the same reproducible build, image build and boot
# smoke test as image.yml (called as a reusable workflow), then:
#   - a PRERELEASE of this repository, for humans:
#       pili-pos-linux-vX.Y.Z-x86_64.tar.gz   deploy/dist (binary, install.sh, update.sh, ...)
#       pili-pos-kiosk-linux-vX.Y.Z.img.xz    production kiosk image (deploy/usb/make-key.sh)
#       build_info-linux-vX.Y.Z.txt           SHA-1 / SHA-256 report (the SHA-1 to declare)
#       SHA256SUMS
#   - the tarball pushed to the public package ghcr.io/nuagemagique-dev/pili-pos
#     as tag linux-vX.Y.Z (oras, OCI artifact).
#
# Nothing here is installed by a terminal: they only read the package's
# "declared" tag (the Android till reads "declared-android", written by
# scripts/release/declare_android.sh). Once SPF Finances has accepted the
# SHA-1, the owner runs scripts/release/declare.sh on the Mac: it signs
# declared.json with the offline minisign key, pushes the "declared"
# artifact and turns the prerelease into the latest release
# (deploy/UPDATE-STRATEGY.md).
#
# Tag pushes only: a pull request (from a fork or not) never runs it, and
# only someone with write access can push a tag. Release candidates
# (linux-vX.Y.Z-rcN, local freeze tags) are not released: image.yml builds
# them if one is ever pushed. Android releases are android-v* tags and never
# start this workflow.
on:
  push:
    tags:
      - 'linux-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/image.yml

  publish:
    name: Publish the prerelease
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the crate version
        run: |
          set -euo pipefail
          CRATE="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "linux-v$CRATE" != "$TAG" ]]; then
            echo "::error::tag $TAG but Cargo.toml says $CRATE"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-dist
          path: deploy/dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-build-info
          path: repro

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kiosk-image-production
          path: image

      - name: Assemble the release files
        run: |
          set -euo pipefail
          chmod +x deploy/dist/pili-pos deploy/dist/install.sh deploy/dist/update.sh
          [[ -f deploy/dist/pos-fdm-mock ]] && chmod +x deploy/dist/pos-fdm-mock
          mkdir out
          # Flat tarball (members without "./"): deploy/ansible/roles/
          # pos_binary extracts the member "pili-pos" by that name.
          ( cd deploy/dist && tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime='@0' -czf "../../out/pili-pos-${TAG}-x86_64.tar.gz" -- * )
          cp image/*.img.xz "out/pili-pos-kiosk-${TAG}.img.xz"
          INFO="$(find repro -path '*run2*' -name 'build_info_*.txt' | head -n1)"
          [[ -n "$INFO" ]] || INFO="$(find repro -name 'build_info_*.txt' | head -n1)"
          cp "$INFO" "out/build_info-${TAG}.txt"
          # The image must embed the binary of the tarball.
          EMBEDDED="$(cat image/pili-pos-embedded-binary.sha1)"
          TARBALL_SHA1="$(sha1sum deploy/dist/pili-pos | awk '{print $1}')"
          if [[ "$EMBEDDED" != "$TARBALL_SHA1" ]]; then
            echo "::error::image embeds $EMBEDDED, tarball has $TARBALL_SHA1"
            exit 1
          fi
          ( cd out && sha256sum -- * > SHA256SUMS )
          echo "SHA1=$TARBALL_SHA1" >> "$GITHUB_ENV"
          ls -l out

      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="pili-pos ${TAG} (Linux kiosk) - binary SHA-1 ${SHA1} (to declare to SPF Finances).
          Prerelease until declared: no terminal installs it before scripts/release/declare.sh ${TAG} --sha1 ${SHA1}."
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --prerelease --latest=false --title "pili-pos ${TAG}" --notes "$NOTES" \
            out/*

      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Push the tarball to ghcr.io (tag linux-vX.Y.Z)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cd out
          oras push "${IMAGE}:${TAG}" \
            --artifact-type application/vnd.pili-pos.release.v1 \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "pili-pos-${TAG}-x86_64.tar.gz:application/gzip"
          oras logout ghcr.io
