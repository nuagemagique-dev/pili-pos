name: Android

# The Android port of pili-pos (android/, scripts/android/). It never runs on a push to a branch
# or on a pull request (Actions minutes, DECISIONS PD84): only by hand and on an android-v* tag.
#
#   gate    the host gate of docs/android/BUILD.md on a Linux runner: cargo fmt, clippy and tests of
#           android/rust, command and lock parity, the Gradle gates (lint, ktlint, detekt, unit
#           tests, mismatch test, API check, release AAR, minified unsigned :smoke APK) and
#           scripts/android/check_apk.sh. No emulator: the instrumented tests, the smoke run and the
#           engine tests on the device stay local (they need the sunmi_d3_pro_api33 AVD).
#   repro   scripts/android/check_repro.sh: two offline container builds of the unsigned APK,
#           compared byte for byte. This is the native x86_64 run of DECISIONS 11.13.
#
# The workflow needs no secret. It signs nothing, uploads to no store and pushes no image.
# The linux test workflow (test.yml) ignores android/** and docs/android/**.
on:
  workflow_dispatch:
    inputs:
      repro:
        description: Run the two-build reproducibility check on a native x86_64 runner
        type: boolean
        default: false
  push:
    tags: ['android-v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  RUST_VERSION: '1.99.0'
  CARGO_NDK_VERSION: '4.1.2'
  NDK_VERSION: '27.1.12297006'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Host gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 ndk;27.1.12297006'

      - name: Android NDK path
        run: echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal \
            --component rustfmt --component clippy --target aarch64-linux-android
          rustup default "${RUST_VERSION}"
          cargo install --locked cargo-ndk --version "${CARGO_NDK_VERSION}"
          rustc --version
          cargo ndk --version

      - uses: gradle/actions/setup-gradle@v5

      - name: Rust format
        working-directory: android/rust
        run: cargo fmt --all --check

      - name: Rust clippy
        working-directory: android/rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        working-directory: android/rust
        run: cargo test --workspace --locked

      - name: Command parity
        run: |
          python3 scripts/android/check_command_parity.py --strict
          python3 scripts/android/check_command_parity.py --hygiene

      - name: Lock parity
        run: bash scripts/android/check_lock_parity.sh

      - name: Gradle gate
        working-directory: android
        run: >-
          ./gradlew --no-daemon --console=plain
          lint ktlintCheck detekt
          :pos-core:testDebugUnitTest :pos-core:mismatchTest :pos-core:apiCheck
          :pos-core:assembleRelease :smoke:assembleRelease
          --continue

      - name: APK check
        run: bash scripts/android/check_apk.sh android/smoke/build/outputs/apk/release/smoke-release-unsigned.apk

      - name: Upload reports
        if: always()
        # A full artifact storage quota must not fail the gate.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  repro:
    name: Reproducible APK (two builds)
    needs: gate
    # Only on request (the repro input) or on an android-v* tag.
    if: ${{ inputs.repro == true || startsWith(github.ref, 'refs/tags/android-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The script builds the pinned image (android/docker/Dockerfile) with docker, prefetches
      # crates and Gradle artifacts once, then builds twice with --network none and compares.
      - name: Two-build reproducibility check
        run: |
          mkdir -p "${RUNNER_TEMP}/repro"
          bash scripts/android/check_repro.sh 2>&1 | tee "${RUNNER_TEMP}/repro/result.txt"

      - name: Collect the values for docs/android/REPRO.md
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/repro"
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "runner=${RUNNER_OS} ${RUNNER_ARCH}"
            uname -m
            docker image inspect pili-android-build:p3 --format 'image-id={{.Id}}' || true
            sha256sum android/docker/Dockerfile
          } > "${RUNNER_TEMP}/repro/values.txt"
          cat "${RUNNER_TEMP}/repro/values.txt"

      - name: Upload the result
        if: always()
        # A full artifact storage quota must not fail the check.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: android-repro
          path: ${{ runner.temp }}/repro/
          if-no-files-found: warn
          retention-days: 30
