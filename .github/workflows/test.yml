name: Tests

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Layer 1: Rust - format, lint and every test ──────────────
  # Both feature sets: the default development build and the
  # certification build (no HubRise, no Peppol). Unit tests, the SPF
  # fixture replays (Basic Set, Reports scenario) and the integration
  # suites all run here; any failure or warning blocks.
  rust:
    name: Rust (${{ matrix.features.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: default
            flags: ""
          - name: cert
            flags: "--no-default-features --features cert"
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (webkit2gtk for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      # rust-toolchain.toml pins the compiler; rustup installs it here.
      - name: Toolchain
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features.name }}

      - name: Format
        if: matrix.features.name == 'default'
        run: cargo fmt --all --check

      - name: Clippy (workspace, all targets)
        if: matrix.features.name == 'default'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (app, cert features)
        if: matrix.features.name == 'cert'
        run: cargo clippy -p moyun-pos --all-targets ${{ matrix.features.flags }} -- -D warnings

      - name: Tests (workspace)
        if: matrix.features.name == 'default'
        run: cargo test --workspace --no-fail-fast

      - name: Tests (app, cert features)
        if: matrix.features.name == 'cert'
        run: cargo test -p moyun-pos ${{ matrix.features.flags }} --no-fail-fast

  # ── Layer 2: Playwright E2E (mock IPC) ────────────────────────
  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type-check and build (dev and cert bundles)
        run: |
          npm run build
          VITE_FEATURE_HUBRISE=false npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit

      - name: Run E2E tests
        run: npx playwright test --reporter=github

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/test-results/
          retention-days: 7

  # ── Layer 3: Integration (real binary + WebDriver) ────────────
  # Runs only on the main branch to avoid burning CI minutes on
  # feature branches. Uses the real Tauri binary with a test DB.
  integration:
    name: Integration (real binary)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [rust, playwright-e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            xvfb

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The certification build, UI bundle embedded: the binary under
      # test is the one declared to SPF Finances.
      - name: Build the certification binary
        run: scripts/build_and_hash.sh

      - name: Install Playwright
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps webkit

      # The binary creates the schema, then loads the seed.
      - name: Seed test database
        run: ./target/release/moyun-pos --init-db --seed ui/e2e/fixtures/seed.sql
        env:
          MOYUN_POS_DATA_DIR: /tmp/moyun-pos

      - name: Start POS binary
        run: |
          export MOYUN_POS_DATA_DIR=/tmp/moyun-pos
          export WEBKIT_INSPECTOR_SERVER=127.0.0.1:9222
          xvfb-run -- ./target/release/moyun-pos &
          # Wait for healthcheck
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9999/health && break || sleep 1
          done

      - name: Run integration tests
        working-directory: ui
        run: npx playwright test --project=integration --reporter=github
        env:
          INTEGRATION_CDP_URL: http://127.0.0.1:9222

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: ui/test-results/
          retention-days: 7

  # ── Dossier: certification bundle consistency ──────────────────
  # Cross-checks docs/SUBMISSION_ARTIFACTS against the code (Rust
  # identifiers, repo paths, brand-neutral wording, no em dashes, no
  # leftover placeholders). The dossier is being rewritten in parallel,
  # so this job may be red for a while; that is expected, not a bug in
  # the checker.
  dossier:
    name: Dossier consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run checker unit tests
        run: python3 scripts/test_check_dossier.py -v

      - name: Check dossier against the code
        run: python3 scripts/check_dossier.py
