name: Tests

on:
  push:
    branches: [main, feat/*]
    paths-ignore: ['android/**', 'docs/android/**']
  pull_request:
    branches: [main]
    paths-ignore: ['android/**', 'docs/android/**']
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Layer 1: Rust - format, lint and every test ──────────────
  # Both feature sets: the default development build and the
  # certification build (no HubRise, no Peppol). Unit tests, the SPF
  # fixture replays (Basic Set, Reports scenario) and the integration
  # suites all run here; any failure or warning blocks.
  rust:
    name: Rust (${{ matrix.features.name }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: default
            flags: ""
          - name: cert
            flags: "--no-default-features --features cert"
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (webkit2gtk for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      # rust-toolchain.toml pins the compiler; rustup installs it here.
      - name: Toolchain
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features.name }}

      # The cert build embeds the UI bundle (tauri.conf.json frontendDist,
      # custom-protocol): build it as scripts/build_and_hash.sh does,
      # webshop left out.
      - name: Setup Node (cert)
        if: matrix.features.name == 'cert'
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"  # latest LTS, same as deploy/build-release.sh
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI bundle (cert)
        if: matrix.features.name == 'cert'
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Format
        if: matrix.features.name == 'default'
        run: cargo fmt --all --check

      - name: Clippy (workspace, all targets)
        if: matrix.features.name == 'default'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (app, cert features)
        if: matrix.features.name == 'cert'
        run: cargo clippy -p pili-pos --all-targets ${{ matrix.features.flags }} -- -D warnings

      - name: Tests (workspace)
        if: matrix.features.name == 'default'
        run: cargo test --workspace --no-fail-fast

      - name: Tests (app, cert features)
        if: matrix.features.name == 'cert'
        run: cargo test -p pili-pos ${{ matrix.features.flags }} --no-fail-fast

  # ── Layer 2: Playwright E2E (mock IPC) ────────────────────────
  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"  # latest LTS, same as deploy/build-release.sh
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit

      - name: Run E2E tests
        run: npx playwright test --reporter=github

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui/test-results/
          retention-days: 7

  # ── Layer 3: Integration (real binary + WebDriver) ────────────
  # Runs only on the main branch (or a manual run) to avoid burning CI
  # minutes on feature branches. The certification binary, its real
  # SQLite database and IPC, driven over WebDriver: tauri-driver +
  # WebKitWebDriver, as Tauri documents for Linux (ui/e2e/real-binary/).
  integration:
    name: Integration (real binary)
    runs-on: ubuntu-26.04
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [rust, playwright-e2e]
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            xvfb \
            webkitgtk-webdriver

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"  # latest LTS, same as deploy/build-release.sh
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked

      # The certification build, UI bundle embedded: the binary under
      # test is the one declared to SPF Finances.
      - name: Build the certification binary
        run: scripts/build_and_hash.sh

      # The FDM the binary talks to: without an answering FDM the
      # sales screens are veiled (POS blocks, SCE 2.0). The development
      # configuration points at http://localhost:8081/graphql.
      - name: Build the mock FDM
        run: cargo build --release -p pos-fdm-mock

      # The binary creates the schema, then loads the seed.
      - name: Seed test database
        run: ./target/release/pili-pos --init-db --seed ui/e2e/fixtures/seed.sql
        env:
          PILI_POS_DATA_DIR: /tmp/pili-pos

      # tauri-driver starts WebKitWebDriver, which launches the binary
      # with this environment.
      - name: Run integration tests
        working-directory: ui
        env:
          PILI_POS_DATA_DIR: /tmp/pili-pos
          PILI_POS_BINARY: ${{ github.workspace }}/target/release/pili-pos
          TAURI_DRIVER_URL: http://127.0.0.1:4444
          DISPLAY: ":99"
          GDK_BACKEND: x11
        run: |
          ../target/release/pos-fdm-mock > /tmp/fdm-mock.log 2>&1 &
          Xvfb :99 -screen 0 1920x1080x24 &
          tauri-driver --port 4444 > /tmp/tauri-driver.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4444/status >/dev/null \
              && curl -sf http://127.0.0.1:8081/mock/control >/dev/null && break
            sleep 1
          done
          npm run test:real-binary

      - name: tauri-driver log
        if: always()
        run: cat /tmp/tauri-driver.log || true

  # ── Dossier: certification bundle consistency ──────────────────
  # Cross-checks docs/SUBMISSION_ARTIFACTS against the code (Rust
  # identifiers, repo paths, brand-neutral wording, no em dashes, no
  # leftover placeholders). The dossier is being rewritten in parallel,
  # so this job may be red for a while; that is expected, not a bug in
  # the checker.
  dossier:
    name: Dossier consistency
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run checker unit tests
        run: python3 scripts/test_check_dossier.py -v

      - name: Check dossier against the code
        run: python3 scripts/check_dossier.py
