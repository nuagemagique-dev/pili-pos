name: Tests

on:
  push:
    branches: [main, feat/*]
    paths-ignore: ['android/**', 'docs/android/**']
  pull_request:
    branches: [main]
    paths-ignore: ['android/**', 'docs/android/**']
  workflow_dispatch: {}

# One runner: a newer run of the same branch replaces a queued or running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The engine has over a hundred integration test binaries: without debug
  # info and incremental data the debug target stays a few GB. Tests do not
  # need debug info; backtraces still name the functions.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Toolchains and caches live inside the job container, never in the
  # host-mounted home (scripts/ci/setup.sh).
  RUSTUP_HOME: /opt/rustup
  CARGO_HOME: /opt/cargo
  npm_config_cache: /tmp/npm-cache
  PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
  NODE_VERSION: "24.21.0"  # latest LTS, same as deploy/build-release.sh

# Every job runs on the homelab runner (self-hosted, Linux ARM64, label
# moyun-pos) in a fresh Ubuntu container. Nothing stays on the host after a
# job: the build output is inside the container, which the runner removes,
# and the last step (scripts/ci/cleanup.sh, run even on failure) empties the
# host-mounted checkout, temp and home folders. No cache, no artifact upload.

jobs:
  # ── Layer 1: Rust - format, lint and every test ──────────────
  # Both feature sets: the default development build and the
  # certification build (HubRise in; invoicing is in both). Unit tests, the SPF
  # fixture replays (Basic Set, Reports scenario) and the integration
  # suites all run here; any failure or warning blocks.
  rust:
    name: Rust (${{ matrix.features.name }})
    runs-on: [self-hosted, moyun-pos]
    container: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: default
            flags: ""
          - name: cert
            flags: "--no-default-features --features cert"
    env:
      CARGO_TARGET_DIR: /tmp/target
    steps:
      - name: Git for the checkout
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain and system deps (webkit2gtk for Tauri)
        run: >-
          scripts/ci/setup.sh --rust ${{ matrix.features.name == 'cert' && '--node "$NODE_VERSION"' || '' }}
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      # The cert build embeds the UI bundle (tauri.conf.json frontendDist,
      # custom-protocol): build it as scripts/build_and_hash.sh does,
      # webshop left out.
      - name: UI bundle (cert)
        if: matrix.features.name == 'cert'
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Format
        if: matrix.features.name == 'default'
        run: cargo fmt --all --check

      - name: Clippy (workspace, all targets)
        if: matrix.features.name == 'default'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (app, cert features)
        if: matrix.features.name == 'cert'
        run: cargo clippy -p pili-pos --all-targets ${{ matrix.features.flags }} -- -D warnings

      - name: Clippy (engine, cert features)
        if: matrix.features.name == 'cert'
        run: cargo clippy -p pos-engine --all-targets ${{ matrix.features.flags }} -- -D warnings

      - name: Tests (workspace)
        if: matrix.features.name == 'default'
        run: cargo test --workspace --no-fail-fast

      - name: Tests (app, cert features)
        if: matrix.features.name == 'cert'
        run: cargo test -p pili-pos ${{ matrix.features.flags }} --no-fail-fast

      - name: Tests (engine, cert features)
        if: matrix.features.name == 'cert'
        run: cargo test -p pos-engine ${{ matrix.features.flags }} --no-fail-fast

      - name: Clean up the runner
        if: always()
        run: bash "$GITHUB_WORKSPACE/scripts/ci/cleanup.sh" || find "$GITHUB_WORKSPACE" -mindepth 1 -delete

  # ── Layer 2: Playwright E2E (mock IPC) ────────────────────────
  playwright-e2e:
    name: Playwright E2E
    runs-on: [self-hosted, moyun-pos]
    container: ubuntu:26.04
    steps:
      - name: Git for the checkout
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node
        run: scripts/ci/setup.sh --node "$NODE_VERSION"

      - name: Install deps
        working-directory: ui
        run: npm ci

      - name: Type-check and build
        working-directory: ui
        run: npm run build

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps webkit

      - name: Run E2E tests
        working-directory: ui
        run: npx playwright test --reporter=github

      - name: Clean up the runner
        if: always()
        run: bash "$GITHUB_WORKSPACE/scripts/ci/cleanup.sh" || find "$GITHUB_WORKSPACE" -mindepth 1 -delete

  # ── Layer 3: Integration (real binary + WebDriver) ────────────
  # Runs only on the main branch (or a manual run). The certification
  # binary, its real SQLite database and IPC, driven over WebDriver:
  # tauri-driver + WebKitWebDriver, as Tauri documents for Linux
  # (ui/e2e/real-binary/).
  integration:
    name: Integration (real binary)
    runs-on: [self-hosted, moyun-pos]
    container: ubuntu:26.04
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [rust, playwright-e2e]
    steps:
      - name: Git for the checkout
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain and system deps
        run: >-
          scripts/ci/setup.sh --rust --node "$NODE_VERSION"
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
          xvfb webkitgtk-webdriver

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked

      # The certification build, UI bundle embedded: the binary under
      # test is the one of the Linux product.
      - name: Build the certification binary
        run: scripts/build_and_hash.sh

      # The FDM the binary talks to: without an answering FDM the
      # sales screens are veiled (POS blocks, SCE 2.0). The development
      # configuration points at http://localhost:8081/graphql.
      - name: Build the mock FDM
        run: cargo build --release -p pos-fdm-mock

      # The binary creates the schema, then loads the seed.
      - name: Seed test database
        run: ./target/release/pili-pos --init-db --seed ui/e2e/fixtures/seed.sql
        env:
          PILI_POS_DATA_DIR: /tmp/pili-pos

      # tauri-driver starts WebKitWebDriver, which launches the binary
      # with this environment.
      - name: Run integration tests
        working-directory: ui
        env:
          PILI_POS_DATA_DIR: /tmp/pili-pos
          PILI_POS_BINARY: ${{ github.workspace }}/target/release/pili-pos
          TAURI_DRIVER_URL: http://127.0.0.1:4444
          DISPLAY: ":99"
          GDK_BACKEND: x11
        run: |
          ../target/release/pos-fdm-mock > /tmp/fdm-mock.log 2>&1 &
          Xvfb :99 -screen 0 1920x1080x24 &
          tauri-driver --port 4444 > /tmp/tauri-driver.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4444/status >/dev/null \
              && curl -sf http://127.0.0.1:8081/mock/control >/dev/null && break
            sleep 1
          done
          npm run test:real-binary

      - name: tauri-driver log
        if: always()
        run: cat /tmp/tauri-driver.log || true

      - name: Clean up the runner
        if: always()
        run: bash "$GITHUB_WORKSPACE/scripts/ci/cleanup.sh" || find "$GITHUB_WORKSPACE" -mindepth 1 -delete

  # ── Dossier: certification bundle consistency ──────────────────
  # Cross-checks docs/SUBMISSION_ARTIFACTS against the code (Rust
  # identifiers, repo paths, brand-neutral wording, no em dashes, no
  # leftover placeholders).
  dossier:
    name: Dossier consistency
    runs-on: [self-hosted, moyun-pos]
    container: ubuntu:26.04
    steps:
      - name: Git and Python
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates python3

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run checker unit tests
        run: python3 scripts/test_check_dossier.py -v

      - name: Check dossier against the code
        run: python3 scripts/check_dossier.py

      - name: Clean up the runner
        if: always()
        run: bash "$GITHUB_WORKSPACE/scripts/ci/cleanup.sh" || find "$GITHUB_WORKSPACE" -mindepth 1 -delete
